name: CI/CD - Guías de Despacho

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/guias-despacho
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Job 1: Build y Tests ──────────────────────────────────────────────────
  build:
    name: Build y Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar tests
        run: mvn clean verify -B

      - name: Subir reporte de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  # ── Job 2: Build y Push imagen Docker ────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

  # ── Job 3: Deploy en EC2 ──────────────────────────────────────────────────
  deploy:
    name: Deploy en EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar en EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login a Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Detener y eliminar el contenedor anterior si existe
            docker stop guias-despacho || true
            docker rm guias-despacho || true

            # Descargar la imagen más reciente
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            # Ejecutar el contenedor con EFS montado
            # El EFS debe estar previamente montado en /mnt/efs en la instancia EC2
            docker run -d \
              --name guias-despacho \
              --restart unless-stopped \
              -p 8080:8080 \
              -v /mnt/efs:/app/efs \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }} \
              -e EFS_MOUNT_PATH=/app/efs \
              ${{ env.DOCKER_IMAGE }}:latest

            # Limpiar imágenes antiguas
            docker image prune -f

            echo "✅ Despliegue completado exitosamente"

      - name: Verificar despliegue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 15
            curl -f http://localhost:8080/api/guias/health || exit 1
            echo "✅ Aplicación respondiendo correctamente"
