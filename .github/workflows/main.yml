name: CI/CD - Guías de Despacho S8

on:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/guias-despacho
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build y Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: mvn clean package -DskipTests -B

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy en EC2
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_GUIAS_HOST }}
          username: ${{ secrets.EC2_GUIAS_USER }}
          key: ${{ secrets.EC2_GUIAS_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== Levantando RabbitMQ si no esta corriendo ==="
            if ! sudo docker ps | grep -q rabbitmq-guias; then
              sudo docker run -d \
                --name rabbitmq-guias \
                --restart unless-stopped \
                -p 5672:5672 \
                -p 15672:15672 \
                -e RABBITMQ_DEFAULT_USER=guest \
                -e RABBITMQ_DEFAULT_PASS=guest \
                rabbitmq:3-management
              sleep 15
            fi

            sudo docker stop guias-despacho 2>/dev/null || true
            sudo docker rm guias-despacho 2>/dev/null || true
            sudo docker pull ${{ env.DOCKER_IMAGE }}:latest

            sudo docker run -d \
              --name guias-despacho \
              --restart unless-stopped \
              -p 8080:8080 \
              -v /mnt/efs:/app/efs \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET_GUIAS }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }} \
              -e EFS_MOUNT_PATH=/app/efs \
              -e AZURE_AD_B2C_JWKS_URI=${{ secrets.AZURE_AD_B2C_JWKS_URI }} \
              -e AZURE_AD_B2C_ISSUER_URI=${{ secrets.AZURE_AD_B2C_ISSUER_URI }} \
              -e RABBITMQ_HOST=host.docker.internal \
              --add-host=host.docker.internal:host-gateway \
              ${{ env.DOCKER_IMAGE }}:latest

            sudo docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_GUIAS_HOST }}
          username: ${{ secrets.EC2_GUIAS_USER }}
          key: ${{ secrets.EC2_GUIAS_SSH_KEY }}
          script: |
            sleep 20
            curl -f http://localhost:8080/actuator/health || exit 1
            echo "Aplicacion respondiendo correctamente"
