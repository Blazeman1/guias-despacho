# Server
server.port=8080
spring.application.name=guias-despacho

# H2 Database (simple, no requiere motor externo)
spring.datasource.url=jdbc:h2:file:./data/guiasdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET:guias-despacho-bucket}
aws.region=${AWS_REGION:us-east-1}

# EFS - Directorio de almacenamiento temporal
app.efs.path=${EFS_MOUNT_PATH:/app/efs}

# Logging
logging.level.com.duocuc=DEBUG
